# Virtual Drum receiver: ESB PRX -> USB CDC ACM relay (TASK-008).

CONFIG_GPIO=y
CONFIG_BUILD_OUTPUT_UF2=y

# USB device stack ("device_next") with one CDC ACM function.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_RING_BUFFER=y

# Nothing but protocol frames may reach the host: no console, no logs (printk then goes nowhere).
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG=n

# ESB receiver. RAW packets need dynamic payloads up to RADIO_MAX_PAYLOAD (105 bytes).
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128
CONFIG_ESB_RX_FIFO_SIZE=16
