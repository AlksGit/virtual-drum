# Virtual Drum stick (XIAO nRF52840 Sense).

CONFIG_GPIO=y
CONFIG_BUILD_OUTPUT_UF2=y

# IMU on i2c0; its supply is the "lsm6ds3tr-c-en" fixed regulator, enabled at boot.
CONFIG_I2C=y
CONFIG_REGULATOR=y

# The sensor is driven directly through ST's driver: keep Zephyr's sensor drivers out.
CONFIG_SENSOR=n

# ESB transmitter. RAW packets need dynamic payloads up to RADIO_MAX_PAYLOAD (105 bytes).
CONFIG_ESB=y
CONFIG_CLOCK_CONTROL=y
CONFIG_ESB_CLOCK_INIT=y
CONFIG_ESB_MAX_PAYLOAD_LENGTH=128

# No USB on the stick: the xiao_ble board enables a USB CDC console by default
# (boards/common/usb/Kconfig.cdc_acm_serial.defconfig). The stick logs nothing and reports over
# the radio, so its USB interrupts and threads (while charging) are not wanted. USB-C still
# charges the battery, and the UF2 bootloader (double-tap reset) is unaffected.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
