name: host

on:
  push:
    paths:
      - "host/**"
      - "firmware/common/**"
      - ".github/workflows/host.yml"
  pull_request:
    paths:
      - "host/**"
      - "firmware/common/**"
      - ".github/workflows/host.yml"
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            generator: ""
          - os: macos-latest
            generator: "-G Xcode"

    steps:
      - uses: actions/checkout@v4

      # JUCE sources only depend on the pinned tag in host/CMakeLists.txt.
      - name: Cache JUCE sources
        uses: actions/cache@v4
        with:
          path: host/build/_deps/juce-src
          key: juce-${{ runner.os }}-${{ hashFiles('host/CMakeLists.txt') }}

      - name: Configure
        working-directory: host
        run: cmake -S . -B build ${{ matrix.generator }}

      - name: Build
        working-directory: host
        run: cmake --build build --config Release --parallel
